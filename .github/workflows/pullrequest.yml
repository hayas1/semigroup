name: Pull Request

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/cargo-setup
      with:
        components: rustfmt, clippy
    - run: cargo test --all
    - run: cargo test --all --all-features
    - run: cargo fmt --check
    - run: RUSTDOCFLAGS="-D warnings" cargo +nightly rustdoc --manifest-path semigroup/Cargo.toml --all-features -- --cfg doc_cfg
    - run: cargo clippy --version && cargo clippy --tests -- --deny warnings
    - run: cargo install cargo-rdme && cargo rdme --check

  bench:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/cargo-setup
    - run: cargo bench --all-features

  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Check version in Cargo.toml and git tag
      uses: ./.github/actions/versions
      id: detect-version
    - name: Add label
      if: steps.detect-version.outputs.should-release == 'true'
      run: |
        gh pr edit ${{ github.event.pull_request.number }} --add-label "release"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
